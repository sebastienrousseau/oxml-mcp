[package]
name = "oxml-mcp"
version = "0.0.8"
edition = "2024"
rust-version = "1.86.0"
license = "MIT OR Apache-2.0"
description = "Model Context Protocol server exposing oxml's XML parsing, XPath and XSD validation"
repository = "https://github.com/sebastienrousseau/oxml-mcp"
homepage = "https://github.com/sebastienrousseau/oxml-mcp"
documentation = "https://docs.rs/oxml-mcp"
readme = "README.md"
keywords = ["xml", "xpath", "mcp", "llm", "xsd"]
categories = ["command-line-utilities", "parser-implementations"]
authors = ["Sebastien Rousseau <sebastian.rousseau@gmail.com>"]

[lib]
name = "oxml_mcp"
path = "src/lib.rs"

[[bin]]
name = "oxml-mcp"
path = "src/main.rs"

[dependencies]
oxml = "0.0.8"
oxml-json = "0.0.8"
xmlschema = "0.0.8"

[[example]]
name = "serve_a_session"
path = "examples/serve_a_session.rs"

[[bench]]
name = "protocol"
path = "benches/protocol.rs"
harness = false

[dev-dependencies]
oxml-json = "0.0.8"

[lints.rust]
missing_docs = "warn"
unused_results = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
