[package]
name = "oxml-mcp"
version = "0.0.8"
edition = "2024"
rust-version = "1.88.0"
license = "MIT OR Apache-2.0"
description = "Model Context Protocol server exposing oxml's XML parsing, XPath and XSD validation"
repository = "https://github.com/sebastienrousseau/oxml-mcp"
homepage = "https://github.com/sebastienrousseau/oxml-mcp"
documentation = "https://docs.rs/oxml-mcp"
readme = "README.md"
keywords = ["xml", "xpath", "mcp", "llm", "xsd"]
categories = ["command-line-utilities", "parser-implementations"]
authors = ["Sebastien Rousseau <sebastian.rousseau@gmail.com>"]

# What reaches crates.io.
#
# Without this, cargo packages every tracked file: CI workflows, the
# dependabot config, .gitignore, the DCO, the governance documents.
# That is how oxml-json 0.0.8 shipped an assurance case describing a
# different crate -- a file nobody thought of as published, uploaded to
# a registry where nothing can be edited afterwards.
#
# Listed rather than excluded, so a new directory is absent by default
# instead of shipped by default.
include = [
    "/CHANGELOG.md",
    "/Cargo.toml",
    "/LICENSE",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
    "/README.md",
    "/benches/**",
    "/examples/**",
    "/src/**",
    "/tests/**",
]

[lib]
name = "oxml_mcp"
path = "src/lib.rs"

[[bin]]
name = "oxml-mcp"
path = "src/main.rs"

[dependencies]
oxml = "0.0.8"
xmlschema = "0.0.8"
# The official MCP SDK: protocol revisions 2024-11-05 through
# 2026-07-28, stdio and streamable HTTP. The legacy HTTP+SSE bridge in
# src/transport.rs is the only protocol code left in this crate.
rmcp = { version = "3.4", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
tokio-util = "0.7"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
uuid = { version = "1", features = ["v4"] }

[[example]]
name = "serve_a_session"
path = "examples/serve_a_session.rs"

[[bench]]
name = "protocol"
path = "benches/protocol.rs"
harness = false

[dev-dependencies]
# The client half of the SDK, so tests and the example can hold a real
# session against the server through an in-memory pipe.
rmcp = { version = "3.4", features = ["client"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "time"] }

[lints.rust]
missing_docs = "warn"
unused_results = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
