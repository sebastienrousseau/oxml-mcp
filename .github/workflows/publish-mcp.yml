name: Publish to MCP Registry

# On every release tag: build the OCI image the registry entry points at,
# push it to GHCR, stamp server.json with the tag's version and publish the
# entry. crates.io stays the native install route (release.yml); the image
# exists because the registry's package types do not include crates.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-mcp:
    name: Publish oxml-mcp to MCP Registry
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(jq -r '.version' server.json)
            echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: The tag must match Cargo.toml
        run: |
          crate=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          [ "$crate" = "${{ steps.version.outputs.VERSION }}" ] || {
            echo "tag says ${{ steps.version.outputs.VERSION }} but Cargo.toml says $crate"; exit 1; }

      - name: Check if already published to MCP Registry
        id: check_published
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          if curl -sf "https://registry.modelcontextprotocol.io/v0.1/servers/io.github.sebastienrousseau%2Foxml-mcp/versions/${VERSION}" >/dev/null; then
            echo "oxml-mcp ${VERSION} is already published on the MCP Registry; skipping publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "oxml-mcp ${VERSION} not found on MCP Registry; proceeding with publish"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push OCI image
        if: steps.check_published.outputs.skip == 'false'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/sebastienrousseau/oxml-mcp:${{ steps.version.outputs.VERSION }}
            ghcr.io/sebastienrousseau/oxml-mcp:latest
          labels: |
            io.modelcontextprotocol.server.name=io.github.sebastienrousseau/oxml-mcp
            org.opencontainers.image.source=https://github.com/sebastienrousseau/oxml-mcp
            org.opencontainers.image.version=${{ steps.version.outputs.VERSION }}

      - name: Sync version in server.json
        if: steps.check_published.outputs.skip == 'false'
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          # Only the top-level version and the OCI tag on the identifier:
          # the registry's 2025-12-11 schema forbids packages[*].version on
          # OCI packages.
          jq --arg v "$VERSION" '
            .version = $v
            | .packages[0].identifier = "ghcr.io/sebastienrousseau/oxml-mcp:" + $v
            | del(.packages[0].version)
          ' server.json > server.tmp && mv server.tmp server.json

      - name: Install mcp-publisher
        if: steps.check_published.outputs.skip == 'false'
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher

      - name: Authenticate to MCP Registry (GitHub OIDC)
        if: steps.check_published.outputs.skip == 'false'
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        if: steps.check_published.outputs.skip == 'false'
        run: |
          if ! output=$(./mcp-publisher publish 2>&1); then
            if echo "$output" | grep -q "cannot publish duplicate version"; then
              echo "Version already exists on MCP Registry; treated as idempotent success."
            else
              echo "$output"
              exit 1
            fi
          else
            echo "$output"
          fi
